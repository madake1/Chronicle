<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>历史时空 · Chronicle</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/atlas/vendor/maplibre-gl.css">
  <link rel="stylesheet" href="/atlas/atlas.css">
  <script type="module" src="/atlas/atlas.mjs"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Chronicle<span>个人作品档案</span></a>
    <nav aria-label="页面">
      <a class="nav-link" href="/">作品库</a>
      <a class="nav-link" href="/atlas" aria-current="page">历史时空</a>
    </nav>
  </header>
  <main>
    <div class="heading">
      <div><h1>历史时空</h1><p class="meta">世界政权疆界 · 年代切片</p></div>
    </div>
    <section class="panel atlas-panel" aria-label="历史世界地图">
      <div class="atlas-toolbar">
        <div class="atlas-time">
          <label for="atlas-year">地图年代</label>
          <input id="atlas-year" type="range" min="0" max="3" step="1" value="0" disabled>
          <div id="atlas-years" aria-hidden="true"></div>
        </div>
        <p id="atlas-status" role="status">正在加载地图…</p>
      </div>
      <div class="atlas-map-stage">
        <div id="atlas-map" aria-label="可平移和缩放的世界地图"></div>
        <section id="atlas-polity" class="panel atlas-polity" aria-label="政权资料" hidden>
          <div class="atlas-polity-header">
            <h2 id="atlas-polity-name"></h2>
            <button id="atlas-polity-close" type="button" aria-label="关闭政权资料">×</button>
          </div>
          <p id="atlas-polity-original" class="meta" lang="en" hidden></p>
          <div class="atlas-polity-dates">
            <div><span class="meta">当前地图年份</span><p id="atlas-polity-year"></p></div>
            <div><span class="meta">疆界资料年代</span><p id="atlas-polity-years"></p></div>
          </div>
          <p id="atlas-polity-area" hidden></p>
          <p><a id="atlas-polity-encyclopedia" target="_blank" rel="noopener noreferrer" hidden>查看百科</a>
            <span id="atlas-polity-no-encyclopedia" class="meta">暂无百科链接</span></p>
          <details id="atlas-polity-history">
            <summary>历史疆域演变</summary>
            <p class="meta">以下是疆界资料适用年代。</p>
            <ul id="atlas-history-list"></ul>
          </details>
        </section>
      </div>
      <footer class="atlas-footer">
        <span><i aria-hidden="true"></i> Cliopatria 收录的历史疆界</span>
        <span>Natural Earth 自然地理底图</span>
        <span>未着色区域表示本数据集缺少记录，当时仍可能有人居住或存在政权。</span>
      </footer>
    </section>
    <details class="atlas-sources">
      <summary>地图数据来源</summary>
      <ul id="atlas-sources"></ul>
      <p id="atlas-source-record" hidden></p>
    </details>
  </main>
</body>
</html>
