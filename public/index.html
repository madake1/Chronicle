<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chronicle · 作品时间轴</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/notes.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Chronicle<span>个人作品档案</span></a>
    <nav aria-label="页面">
      <button data-page="library" aria-current="page">作品库</button>
      <button data-page="timeline">时间轴</button>
      <a class="nav-link" href="/knowledge">知识库</a>
      <a class="nav-link" href="/atlas">历史时空</a>
    </nav>
    <button id="theme" class="quiet" aria-label="切换主题">切换主题</button>
  </header>
  <main>
    <div class="heading">
      <div><h1 id="page-title">作品库</h1><p id="summary"></p></div>
      <div class="library-actions">
        <button id="export-notes" type="button" disabled>批量导出笔记</button>
        <button id="add" class="primary">＋ 新增作品</button>
      </div>
    </div>
    <div class="filters">
      <input id="search" type="search" placeholder="搜索作品名称" aria-label="搜索作品名称">
      <select id="type-filter" aria-label="作品类型"></select>
      <select id="status-filter" aria-label="体验状态"></select>
      <label id="sort-control" hidden>排序 <select id="sort"><option value="recent">体验日期</option><option value="year">故事年代</option><option value="title">作品名称</option><option value="rating">个人评分</option></select></label>
    </div>
    <p id="notice" role="status" hidden></p>
    <div class="workspace">
      <section id="timeline" class="panel" aria-label="故事时间轴" hidden>
        <div class="toolbar">
          <form id="jump"><input name="year" placeholder="例如 公元前431" aria-label="定位年份" required><button>定位年份</button></form>
          <div class="controls">
            <button id="back">上一视图</button><button id="fit">适应全部</button>
            <button id="out" aria-label="缩小">−</button><button id="in" aria-label="放大">＋</button>
          </div>
        </div>
        <div class="timeline-scroll">
          <div id="axis" class="timeline-row axis"><div>作品</div><div id="ruler" class="plot"></div></div>
          <div id="rows"></div>
        </div>
        <footer class="legend"><span>━ 故事跨度</span><span>◆ 年份 / 短跨度</span><span>▱ 可能发生范围</span><span id="visible-span"></span><span class="hint">滚轮缩放 · 拖动平移</span></footer>
      </section>
      <section id="library" class="panel" aria-label="作品库"></section>
      <aside id="details" class="panel" aria-label="作品详情" hidden></aside>
    </div>
  </main>
  <dialog id="editor">
    <form id="edit-form">
      <div class="dialog-head"><h2 id="edit-title"></h2><button type="button" id="cancel-top" aria-label="关闭">×</button></div>
      <div class="form-grid">
        <label class="wide">作品名称<input name="title" required maxlength="180"></label>
        <label>类型<select name="type"></select></label><label>状态<select name="status"></select></label>
        <label>地区<input name="region"></label><label>历史时期<input name="period"></label>
        <label>历史背景<select name="basis"><option value="">未填写</option><option>真实历史</option><option>历史架空</option><option>完全虚构</option></select></label>
        <label>评分（0–10）<input name="rating" type="number" min="0" max="10" step="0.5"></label>
        <fieldset class="wide"><legend>故事时间段</legend><p class="meta">留空表示年代未知。</p><div id="segment-fields"></div><button type="button" id="add-segment">＋ 添加时间段</button></fieldset>
        <fieldset class="wide">
          <legend>体验进度</legend>
          <div class="form-grid">
            <label>开始日期<input name="startedOn" type="date"></label>
            <label>结束日期<input name="endedOn" type="date"></label>
            <label>体验时长（分钟）<input name="durationMinutes" type="number" min="0" step="1"></label>
          </div>
        </fieldset>
        <label class="wide">作品简介<textarea name="synopsis" rows="3"></textarea></label>
        <label class="wide">简评<textarea name="notes" rows="3"></textarea></label>
        <label class="wide">参考链接（每行一个）<textarea name="links" rows="2" placeholder="[链接名称](https://…)"></textarea></label>
      </div>
      <p id="form-error" role="alert"></p>
      <div class="form-actions"><button type="button" id="cancel">取消</button><button class="primary" id="save">保存作品</button></div>
    </form>
  </dialog>
  <dialog id="note-dialog" aria-labelledby="note-title">
    <header class="note-header">
      <h2 id="note-title" tabindex="-1"></h2>
      <button type="button" data-note-action="close" aria-label="关闭笔记">×</button>
    </header>
    <div class="note-body">
      <article class="note-preview" hidden></article>
      <label class="note-editor" hidden>
        <span>Markdown 正文</span>
        <textarea rows="14" placeholder="写下个人评价、历史考据或参考资料…"></textarea>
      </label>
      <input type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
    </div>
    <p class="note-status" role="status"></p>
    <footer class="note-actions">
      <a class="nav-link" data-note-related hidden>关联知识</a>
      <button type="button" data-note-action="markdown">导出 Markdown</button>
      <button type="button" data-note-action="zip">导出 ZIP</button>
      <button type="button" data-note-action="image">插入图片</button>
      <button type="button" class="primary" data-note-action="edit">编辑笔记</button>
      <button type="button" class="primary" data-note-action="save">保存笔记</button>
    </footer>
  </dialog>
  <dialog id="batch-notes" aria-labelledby="batch-notes-title">
    <header class="note-header">
      <h2 id="batch-notes-title">批量导出笔记</h2>
      <button type="button" data-batch="close" aria-label="关闭批量导出">×</button>
    </header>
    <div class="batch-toolbar">
      <label><input type="checkbox" data-batch="all"> 全选所有页</label>
      <span data-batch="count" class="meta"></span>
    </div>
    <div data-batch="list" class="batch-list"></div>
    <div class="batch-toolbar" aria-label="笔记列表翻页">
      <button type="button" data-batch="prev">上一页</button>
      <span data-batch="page" class="meta"></span>
      <button type="button" data-batch="next">下一页</button>
    </div>
    <p data-batch="status" class="note-status" role="status"></p>
    <footer class="note-actions">
      <button type="button" data-batch="export" class="primary">导出 ZIP</button>
    </footer>
  </dialog>
</body>
</html>
