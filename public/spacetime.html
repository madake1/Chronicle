<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chronicle · 个人时空</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/atlas/vendor/maplibre-gl.css">
  <link rel="stylesheet" href="/spacetime.css">
  <script type="module" src="/app-shell.mjs"></script>
  <script type="module" src="/spacetime.mjs"></script>
</head>
<body>
  <header class="top" data-app-shell></header>
  <main class="spacetime">
    <div class="spacetime-heading">
      <div><h1>个人时空</h1><p id="count" class="meta" aria-live="polite"></p></div>
      <div id="view" class="segmented" role="group" aria-label="浏览视图">
        <button type="button" data-view="timeline" aria-pressed="true">时间轴</button>
        <button type="button" data-view="map" aria-pressed="false">地图</button>
        <button type="button" data-view="both" aria-pressed="false">联动</button>
      </div>
    </div>
    <div class="space-controls">
      <input id="query" type="search" placeholder="搜索名称、地点或说明" aria-label="关键词">
      <div class="layer-controls" role="group" aria-label="显示图层">
        <label class="work-layer"><input id="work-layer" type="checkbox" checked><span aria-hidden="true">●</span> 作品</label>
        <label class="knowledge-layer"><input id="knowledge-layer" type="checkbox"><span aria-hidden="true">◆</span> 知识</label>
      </div>
      <p id="layer-status" class="meta" role="status" hidden></p>
    </div>
    <details class="advanced" id="advanced">
      <summary>高级筛选 <span id="filter-count" class="meta"></span></summary>
      <div class="advanced-fields">
        <label id="work-filter">作品类型 <select id="work-type"><option value="">全部</option><option>游戏</option><option>小说</option><option>电影</option><option>电视剧</option><option>其他</option></select></label>
        <label id="knowledge-filter" hidden>知识标签 <select id="tag"><option value="">全部</option></select></label>
        <label>时间筛选 <select id="time"><option value="">不限</option><option value="snapshot">年份快照</option><option value="interval">年代区间</option><option value="cumulative">累计分布</option></select></label>
        <label id="first-field" hidden>起始年 <input id="first" value="1200"></label>
        <label id="last-field" hidden>结束年 <input id="last" value="1300"></label>
        <label><input id="unknown" type="checkbox" checked> 年代未知</label>
        <label id="viewport-field" hidden><input id="viewport" type="checkbox"> 仅当前视野</label>
        <button id="clear" type="button">清除筛选</button>
        <span id="time-explanation" class="meta"></span>
      </div>
    </details>
    <p id="error" role="alert"></p>
    <div class="spacetime-layout" id="layout">
      <section class="panel" id="timeline-panel" aria-label="时间轴">
        <div class="timeline-tools">
          <form id="jump"><input id="jump-year" aria-label="定位年份" placeholder="年份 / 公元前 1 年" required><button>定位</button></form>
          <div class="timeline-actions">
            <button id="earlier" type="button" aria-label="向较早年代平移">←</button>
            <button id="zoom-out" type="button" aria-label="缩小">−</button>
            <button id="zoom-in" type="button" aria-label="放大">＋</button>
            <button id="later" type="button" aria-label="向较晚年代平移">→</button>
            <button id="fit-all" type="button">适配结果</button>
          </div>
        </div>
        <div id="timeline" tabindex="0" aria-label="连续时间轴" aria-describedby="timeline-help"></div>
        <div class="timeline-footer meta">
          <span id="visible-years"></span>
          <span id="timeline-help">横向拖动平移 · Ctrl + 滚轮缩放 · 方向键与 ＋/−</span>
          <span>● 年份　━ 跨度　▱ 不确定</span>
        </div>
      </section>
      <section class="panel" id="map-panel" aria-label="个人时空地图" hidden>
        <div class="map-tools">
          <label>底图参考年 <input id="reference" value="1200"></label>
          <button id="fit-map" type="button" disabled>适配点位</button>
          <p class="meta" id="basemap-status" aria-live="polite"></p>
          <p class="meta" id="place-reference-status" aria-live="polite"></p>
          <p class="meta" id="physical-reference-status" aria-live="polite"></p>
          <span class="meta">自然地理为现代参照。点线下划线标记资料收录名。</span>
        </div>
        <div id="map"></div>
        <div id="coordinate-list" class="annotation-choices" hidden></div>
      </section>
    </div>
    <section id="timeline-cluster" class="panel annotation-selection" aria-label="密集年代标注" hidden></section>
    <section id="selection" class="panel annotation-selection" aria-label="所选标注" hidden></section>
    <section id="unknown-panel" class="panel annotation-selection" hidden>
      <h2>年代未知</h2><div id="unknown-list" class="annotation-choices"></div>
    </section>
  </main>
</body>
</html>
