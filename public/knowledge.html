<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chronicle · 知识库</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/notes.css">
  <link rel="stylesheet" href="/knowledge.css">
  <script type="module" src="/knowledge.mjs"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Chronicle<span>个人作品档案</span></a>
    <nav aria-label="页面">
      <a class="nav-link" href="/">作品库</a>
      <a class="nav-link" href="/?page=timeline">时间轴</a>
      <a class="nav-link" href="/knowledge" aria-current="page">知识库</a>
      <a class="nav-link" href="/atlas">历史时空</a>
    </nav>
    <button id="theme" class="quiet" type="button">切换主题</button>
  </header>
  <main class="knowledge-main">
    <div class="knowledge-heading">
      <h1>知识库</h1>
      <input id="knowledge-search" type="search" aria-label="搜索标题、正文或标签" placeholder="搜索标题、正文或标签">
      <button id="new-note" class="primary" type="button">＋ 记录知识</button>
    </div>
    <p id="knowledge-status" role="status"></p>
    <div class="knowledge-layout">
      <aside class="panel knowledge-panel knowledge-index" aria-label="标签索引">
       <details id="tag-index" open>
        <summary>标签索引</summary>
        <div class="knowledge-actions"><button id="all" type="button">全部知识</button><button id="untagged" type="button">无标签</button></div>
        <div id="tag-tree"></div>
        <button id="manage-tags" type="button">管理标签</button>
       </details>
      </aside>
      <section class="panel knowledge-panel" aria-label="知识列表">
        <div class="knowledge-list-heading"><h2 id="list-heading">全部知识</h2><span id="list-count" class="meta"></span></div>
        <div id="knowledge-list"></div>
        <section id="reader" aria-label="知识详情" hidden></section>
      </section>
    </div>
  </main>
  <dialog id="tag-dialog" aria-labelledby="tag-heading">
    <div class="dialog-head"><h2 id="tag-heading">管理标签</h2><button type="button" data-close aria-label="关闭">×</button></div>
    <div class="tag-manager-toolbar">
      <input id="tag-management-search" type="search" aria-label="搜索标签名称或路径" placeholder="搜索标签名称或路径">
      <button id="new-root-tag" class="primary" type="button">＋ 新建顶级标签</button>
    </div>
    <p class="meta">知识数量含下级并去重</p>
    <div id="tag-management-editor"></div>
    <div id="tag-management-tree"></div>
    <p id="tag-management-status" role="status"></p>
  </dialog>
  <template id="metadata-template">
    <fieldset data-note-fields hidden>
      <label>标题（可选）<input id="metadata-title" maxlength="180"></label>
      <details id="tag-fields"><summary>标签</summary>
        <input id="tag-search" type="search" placeholder="搜索标签" aria-label="搜索标签">
        <div id="tag-choices" class="knowledge-choices"></div>
        <label>新标签<input id="inline-tag" maxlength="100"></label>
        <label>上级标签<select id="inline-parent"></select></label>
        <button id="inline-add" type="button">新建并选中</button>
      </details>
      <details id="relation-fields"><summary>关联条目</summary>
        <input id="target-search" type="search" placeholder="搜索知识、作品或作品笔记" aria-label="搜索关联对象">
        <div id="target-choices" class="knowledge-choices"></div>
      </details>
      <p id="metadata-error" role="alert"></p>
    </fieldset>
  </template>
  <dialog id="related-preview" aria-labelledby="related-title">
    <div class="dialog-head"><h2 id="related-title"></h2><button type="button" data-close aria-label="关闭">×</button></div>
    <article class="note-preview"></article>
    <div class="form-actions"><a id="related-jump">打开原条目</a></div>
  </dialog>
  <dialog id="note-dialog" aria-labelledby="note-title">
    <header class="note-header">
      <h2 id="note-title" tabindex="-1"></h2>
      <button type="button" data-note-action="close" aria-label="关闭笔记">×</button>
    </header>
    <div class="note-body">
      <article class="note-preview" hidden></article>
      <label class="note-editor" hidden>
        <span>Markdown 正文</span>
        <textarea rows="14" placeholder="在这里写下你的知识笔记…"></textarea>
      </label>
      <input type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
    </div>
    <p class="note-status" role="status"></p>
    <footer class="note-actions">
      <button type="button" data-note-action="markdown">导出 Markdown</button>
      <button type="button" data-note-action="zip">导出 ZIP</button>
      <button type="button" data-note-action="image">插入图片</button>
      <button type="button" class="primary" data-note-action="edit">编辑笔记</button>
      <button type="button" class="primary" data-note-action="save">保存笔记</button>
    </footer>
  </dialog>
</body>
</html>
